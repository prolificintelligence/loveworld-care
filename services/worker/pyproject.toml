[project]
name = "lw-care-worker"
version = "1.0.0"
description = "LoveWorld Care — Durable Transactional Outbox Worker, Daily Finance Reconciler & PHI-Free Notification Dispatcher"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.2",
    "lw-care-api",
]

[tool.uv.sources]
lw-care-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lw_care_worker"]
