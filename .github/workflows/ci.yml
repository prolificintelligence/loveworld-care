name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    env:
      LW_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen
      - name: Lint
        run: >-
          uv run ruff check services tests scripts/release_guard.py
          scripts/platform_cloud_release.py scripts/platform_continuity.py
          scripts/platform_vercel_runner.py scripts/verify_continuity_postgres.py
      - name: Tests (adversarial + integration boundary)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    env:
      LWH_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @loveworld-care/platform-web test:api
      - run: pnpm --filter @loveworld-care/platform-web test:pwa
      - run: pnpm build --concurrency=2
